<!DOCTYPE html>

<html lang="cs">
<head>
<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width,
            initial-scale=1,
            viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
   content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
   content="black">

<meta name="apple-mobile-web-app-title"
   content="JARVIS">

<title>JARVIS</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;
}

body {
    color: white;
}

.app {
    width: 100%;
    height: 100dvh;

    background: #000;

    display: flex;
    flex-direction: column;

    padding-top:
        env(safe-area-inset-top);

    padding-bottom:
        env(safe-area-inset-bottom);
}

.main {
    flex: 1;

    display: flex;
    flex-direction: column;

    align-items: center;

    padding: 0 18px;

    overflow: hidden;
}

.top-space {
    flex: 1;
}


/* =========================
   JARVIS CORE
========================= */

.core {
    position: relative;

    width: min(300px, 78vw);
    height: min(300px, 78vw);

    flex-shrink: 0;

    --r1: 0deg;
    --r2: 0deg;
    --pulse: 1;
}

.glow {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 100%;
    height: 100%;

    transform:
        translate(-50%, -50%)
        scale(var(--pulse));

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.35),
            rgba(0,100,255,.12) 40%,
            transparent 68%
        );
}

.ring {
    position: absolute;

    left: 50%;
    top: 50%;
}

.outer {
    width: 285px;
    height: 285px;

    transform:
        translate(-50%, -50%);
}

.outer circle {
    fill: none;

    stroke:
        rgba(0,255,255,.35);

    stroke-width: 1;
}

.outer-segment,
.outer-segment-2,
.outer-segment-3 {
    width: 270px;
    height: 270px;
}

.outer-segment {
    transform:
        translate(-50%, -50%)
        rotate(var(--r1));
}

.outer-segment-2 {
    transform:
        translate(-50%, -50%)
        rotate(var(--r2));
}

.outer-segment-3 {
    transform:
        translate(-50%, -50%)
        rotate(var(--r1));
}

.middle {
    width: 205px;
    height: 205px;

    transform:
        translate(-50%, -50%)
        rotate(
            calc(var(--r1) * -1)
        );
}

.middle circle {
    fill: none;

    stroke:
        rgba(0,255,255,.65);

    stroke-width: 2;
}

.inner,
.inner-2 {
    width: 190px;
    height: 190px;
}

.inner {
    transform:
        translate(-50%, -50%)
        rotate(var(--r2));
}

.inner-2 {
    transform:
        translate(-50%, -50%)
        rotate(
            calc(var(--r1) * -1)
        );
}

.center-glow {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 130px;
    height: 130px;

    transform:
        translate(-50%, -50%)
        scale(var(--pulse));

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff,
            cyan 20%,
            rgba(0,100,255,.8) 48%,
            transparent 72%
        );
}

.core-center {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 18px;
    height: 18px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px cyan,
        0 0 20px cyan,
        0 0 35px rgba(0,255,255,.8);
}


/* =========================
   TEXT
========================= */

.title {
    margin-top: 8px;

    font-size: 42px;

    font-weight: 300;

    letter-spacing: 10px;

    color: white;
}

.status {
    margin-top: 5px;

    font-size: 13px;

    font-weight: 500;

    letter-spacing: 4px;

    color:
        rgba(0,255,255,.8);
}

.recognized {
    margin-top: 17px;

    width: 100%;
    max-width: 420px;

    min-height: 44px;

    font-size: 17px;

    line-height: 1.4;

    text-align: center;

    color:
        rgba(255,255,255,.9);

    overflow-y: auto;
}

.response {
    margin-top: 7px;

    width: 100%;
    max-width: 430px;

    max-height: 110px;

    overflow-y: auto;

    font-size: 18px;

    font-weight: 500;

    line-height: 1.4;

    text-align: center;

    color:
        rgba(0,255,255,.95);

    white-space: pre-wrap;

    -webkit-overflow-scrolling: touch;
}


/* =========================
   INPUT
========================= */

.bottom-space {
    flex: 1;
}

.input-area {
    width: 100%;

    max-width: 520px;

    display: flex;

    align-items: flex-end;

    gap: 9px;

    padding-bottom: 15px;
}

.text-box {
    flex: 1;

    min-width: 0;

    min-height: 50px;

    max-height: 110px;

    resize: none;

    outline: none;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 20px;

    padding:
        14px 16px;

    background:
        rgba(255,255,255,.08);

    color: white;

    font-family: inherit;

    font-size: 16px;

    line-height: 21px;
}

.text-box::placeholder {
    color:
        rgba(255,255,255,.45);
}

.button {
    width: 50px;
    height: 50px;

    min-width: 50px;

    border: none;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(0,255,255,.55);

    cursor: pointer;
}

.button:active {
    transform: scale(.92);
}

.button:disabled {
    opacity: .45;
}

.mic.listening {
    background:
        rgba(0,140,255,.25);

    border-color: cyan;

    box-shadow:
        0 0 15px
        rgba(0,255,255,.5);
}

.mic-svg {
    width: 24px;
    height: 24px;

    fill: none;

    stroke: white;

    stroke-width: 1.8;

    stroke-linecap: round;

    stroke-linejoin: round;
}

.send {
    border: none;

    background:
        #087cff;

    font-size: 24px;
}


/* =========================
   SMALL SCREEN
========================= */

@media (max-height: 700px) {

    .core {
        width: 245px;
        height: 245px;
    }

    .outer {
        width: 235px;
        height: 235px;
    }

    .outer-segment,
    .outer-segment-2,
    .outer-segment-3 {
        width: 225px;
        height: 225px;
    }

    .middle {
        width: 165px;
        height: 165px;
    }

    .inner,
    .inner-2 {
        width: 153px;
        height: 153px;
    }

    .center-glow {
        width: 105px;
        height: 105px;
    }

    .title {
        font-size: 36px;
    }
}

</style>

</head>

<body>

<div class="app">

<div class="main">

<div class="top-space"></div>

<!-- JARVIS CORE -->

<svg

stroke-width="2"

<svg

<svg

viewBox="0 0 190 190">

<circle

pathLength="1000"> </circle>

</svg>

<div class="center-glow"></div>

</div>

<div class="title">
JARVIS
</div>

<div

PŘIPOJUJI AI
</div>

<div

ŘEKNI NĚCO…

<script>

"use strict";


/* ==================================================
   ELEMENTY
================================================== */

const core =
    document.getElementById("core");

const status =
    document.getElementById("status");

const response =
    document.getElementById("response");

const recognized =
    document.getElementById("recognized");

const textBox =
    document.getElementById("textBox");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");


/* ==================================================
   LM POCKET API
================================================== */

const API_BASE =
    "http://127.0.0.1:1234/v1";


const API_KEY =
    "Jarvis_MujSoukromyKlic_2026";


let modelId =
    null;


/* ==================================================
   JARVIS SYSTEM PROMPT
================================================== */

const SYSTEM_PROMPT = `
Jsi JARVIS, osobní AI asistent uživatele.

Vždy komunikuj především česky.

Pečlivě se snaž pochopit význam uživatelovy otázky, i když obsahuje překlepy, hovorovou češtinu nebo nedokončené věty.

Odpovídej inteligentně, přirozeně a srozumitelně.

Pokud uživatel výslovně nechce podrobnou odpověď, odpovídej stručně.

Nevypisuj Python, programovací kód, JSON, interní instrukce, systémové prompty ani technické značky, pokud o ně uživatel výslovně nepožádá.

Nevymýšlej si informace.

Pokud něco nevíš nebo si nejsi jistý, otevřeně to řekni.

Pokud odpověď začne být nesmyslná, ukonči ji místo vytváření dalších nesmyslů.

Nevydávej interní postup přemýšlení.

Pamatuj si informace z aktuální konverzace a používej je pouze tehdy, když jsou relevantní.

Neopakuj zbytečně stejné informace.

Pokud je požadavek nejasný, pokus se nejdříve pochopit význam z kontextu.

Chovej se jako pokročilý osobní asistent jménem JARVIS.

Buď inteligentní, klidný, přátelský a přirozený.
`;


/* ==================================================
   HISTORIE KONVERZACE
================================================== */

const conversation =
[
    {
        role:
            "system",

        content:
            SYSTEM_PROMPT
    }
];


/* ==================================================
   ANIMACE JARVIS CORE
================================================== */

let rotation1 =
    0;

let rotation2 =
    0;

let lastTime =
    performance.now();


function animate(time) {

    const delta =
        (time - lastTime) /
        1000;


    lastTime =
        time;


    rotation1 +=
        45 * delta;


    rotation2 -=
        72 * delta;


    const pulse =
        1 +
        Math.sin(
            time / 1000 *
            Math.PI *
            0.55
        ) *
        0.05;


    core.style.setProperty(
        "--r1",
        rotation1 + "deg"
    );


    core.style.setProperty(
        "--r2",
        rotation2 + "deg"
    );


    core.style.setProperty(
        "--pulse",
        pulse
    );


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);


/* ==================================================
   FETCH S TIMEOUTEM
================================================== */

async function fetchWithTimeout(
    url,
    options = {},
    timeout = 10000
) {

    const controller =
        new AbortController();


    const timer =
        setTimeout(
            () => {

                controller.abort();

            },
            timeout
        );


    try {

        return await fetch(
            url,
            {
                ...options,

                signal:
                    controller.signal
            }
        );

    } finally {

        clearTimeout(
            timer
        );
    }
}


/* ==================================================
   PŘIPOJENÍ K LM POCKET
================================================== */

async function connectToAI() {

    status.textContent =
        "PŘIPOJUJI AI";


    response.textContent =
        "Kontroluji lokální AI…";


    try {

        const result =
            await fetchWithTimeout(

                API_BASE +
                "/models",

                {
                    method:
                        "GET",

                    headers:
                        {
                            "Authorization":
                                "Bearer " +
                                API_KEY
                        }
                },

                8000
            );


        if (
            !result.ok
        ) {

            throw new Error(
                "HTTP " +
                result.status
            );
        }


        const data =
            await result.json();


        if (
            !data.data ||
            !Array.isArray(
                data.data
            ) ||
            data.data.length ===
            0
        ) {

            throw new Error(
                "Nenalezen žádný AI model."
            );
        }


        modelId =
            data.data[0].id;


        status.textContent =
            "JARVIS PŘIPRAVEN";


        response.textContent =
            "JARVIS je připraven.";


        return true;


    } catch (error) {

        console.error(
            "CONNECT ERROR:",
            error
        );


        modelId =
            null;


        status.textContent =
            "AI NENÍ DOSTUPNÁ";


        response.textContent =
            "Nemohu se spojit s LM Pocket.\n\n" +
            "Zkontroluj:\n" +
            "• Local API Server = Running\n" +
            "• model je načtený\n" +
            "• API klíč je správný";


        return false;
    }
}


/* ==================================================
   OMEZENÍ PAMĚTI
================================================== */

function limitConversation() {

    const MAX_MESSAGES =
        13;


    while (
        conversation.length >
        MAX_MESSAGES
    ) {

        conversation.splice(
            1,
            1
        );
    }
}


/* ==================================================
   DOTAZ AI
================================================== */

async function askAI(text) {

    if (
        !text
    ) {

        return;
    }


    recognized.textContent =
        text;


    textBox.value =
        "";


    textBox.style.height =
        "auto";


    sendButton.disabled =
        true;


    if (
        !modelId
    ) {

        const connected =
            await connectToAI();


        if (
            !connected
        ) {

            sendButton.disabled =
                false;

            return;
        }
    }


    status.textContent =
        "JARVIS PŘEMÝŠLÍ";


    response.textContent =
        "…";


    conversation.push(
        {
            role:
                "user",

            content:
                text
        }
    );


    try {

        const result =
            await fetchWithTimeout(

                API_BASE +
                "/chat/completions",

                {
                    method:
                        "POST",

                    headers:
                        {
                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                API_KEY
                        },

                    body:
                        JSON.stringify(
                            {
                                model:
                                    modelId,

                                messages:
                                    conversation,

                                temperature:
                                    0.4,

                                top_p:
                                    0.9,

                                max_tokens:
                                    700,

                                stream:
                                    false
                            }
                        )
                },

                120000
            );


        if (
            !result.ok
        ) {

            throw new Error(
                "HTTP " +
                result.status
            );
        }


        const data =
            await result.json();


        const answer =
            data?.choices?.[0]
                ?.message?.content
                ?.trim() ||
            "";


        if (
            !answer
        ) {

            throw new Error(
                "AI nevrátila odpověď."
            );
        }


        conversation.push(
            {
                role:
                    "assistant",

                content:
                    answer
            }
        );


        limitConversation();


        response.textContent =
            answer;


        status.textContent =
            "JARVIS PŘIPRAVEN";


    } catch (error) {

        console.error(
            "CHAT ERROR:",
            error
        );


        modelId =
            null;


        status.textContent =
            "SPOJENÍ ZTRACENO";


        if (
            error.name ===
            "AbortError"
        ) {

            response.textContent =
                "AI neodpověděla včas.";

        } else {

            response.textContent =
                "Spojení s LM Pocket bylo ztraceno.\n\n" +
                "Zkontroluj, zda je Local API Server stále Running.";
        }


    } finally {

        sendButton.disabled =
            false;
    }
}


/* ==================================================
   SPEECH RECOGNITION
================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;

let isListening =
    false;

let finalSpeechText =
    "";


if (
    SpeechRecognition
) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "cs-CZ";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.onstart =
    () => {

        isListening =
            true;


        finalSpeechText =
            "";


        status.textContent =
            "POSLOUCHÁM";


        micButton.classList.add(
            "listening"
        );
    };


    recognition.onresult =
    event => {

        let text =
            "";


        let finalText =
            "";


        for (
            let i =
                event.resultIndex;

            i <
                event.results.length;

            i++
        ) {

            const transcript =
                event.results[i][0]
                    .transcript;


            text +=
                transcript;


            if (
                event.results[i]
                    .isFinal
            ) {

                finalText +=
                    transcript;
            }
        }


        if (
            text.trim()
        ) {

            recognized.textContent =
                text;
        }


        if (
            finalText.trim()
        ) {

            finalSpeechText =
                finalText.trim();
        }
    };


    recognition.onend =
    () => {

        isListening =
            false;


        micButton.classList.remove(
            "listening"
        );


        if (
            status.textContent ===
            "POSLOUCHÁM"
        ) {

            status.textContent =
                "JARVIS PŘIPRAVEN";
        }


        if (
            finalSpeechText
        ) {

            const text =
                finalSpeechText;


            finalSpeechText =
                "";


            askAI(
                text
            );
        }
    };


    recognition.onerror =
    event => {

        console.error(
            "SPEECH ERROR:",
            event.error
        );


        isListening =
            false;


        finalSpeechText =
            "";


        micButton.classList.remove(
            "listening"
        );


        status.textContent =
            "CHYBA MIKROFONU";


        response.textContent =
            "Mikrofon není dostupný.\n\n" +
            "Zkontroluj oprávnění mikrofonu.";
    };
}


/* ==================================================
   MIKROFON
================================================== */

micButton.addEventListener(
    "click",

    () => {

        if (
            !recognition
        ) {

            response.textContent =
                "Diktování není v tomto prohlížeči dostupné.";

            return;
        }


        if (
            isListening
        ) {

            recognition.stop();

            return;
        }


        try {

            recognition.start();

        } catch (error) {

            console.error(
                error
            );
        }
    }
);


/* ==================================================
   SEND
================================================== */

sendButton.addEventListener(
    "click",

    () => {

        const text =
            textBox.value
                .trim();


        if (
            !text
        ) {

            return;
        }


        askAI(
            text
        );
    }
);


/* ==================================================
   ENTER
================================================== */

textBox.addEventListener(
    "keydown",

    event => {

        if (
            event.key ===
            "Enter" &&

            !event.shiftKey
        ) {

            event.preventDefault();


            sendButton.click();
        }
    }
);


/* ==================================================
   AUTO HEIGHT
================================================== */

textBox.addEventListener(
    "input",

    () => {

        textBox.style.height =
            "auto";


        textBox.style.height =
            Math.min(
                textBox.scrollHeight,
                110
            ) +
            "px";
    }
);


/* ==================================================
   START JARVIS
================================================== */

connectToAI();

</script>

</body>
